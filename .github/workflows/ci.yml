name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Engine Checks & Dashboard Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cost-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: cost-dashboard
        run: npm ci

      - name: Run engine verification checks
        working-directory: cost-dashboard
        run: npm run check

      - name: Build dashboard bundle
        working-directory: cost-dashboard
        run: npm run build
